<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a citation index — masthead, featured ledger cards, field rail, then index tables; detail opens as a side sheet. */
:root{
  --paper:#eef1f3; --sheet:#fbfcfc; --ink:#14212b; --muted:#5b6b76; --rule:#d3dadf;
  --gold:#a8791c; --gold-soft:#f3e7c9; --wolf:#7a4fa3; --wolf-soft:#ece3f5; --use:#1f6f68; --use-soft:#d6ebe8; --bg2:#e3e8ec; --hl:#fff1b8;
  --f-display:"Noto Serif SC","Songti SC","STSong",Georgia,serif;
  --f-body:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11181e; --sheet:#182129; --ink:#e4e9ec; --muted:#93a3ae; --rule:#2b3741;
  --gold:#e0b351; --gold-soft:#3a3020; --wolf:#c3a3e6; --wolf-soft:#2f2540; --use:#5cc2b6; --use-soft:#183a37; --bg2:#1f2a33; --hl:#4a4020; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11181e; --sheet:#182129; --ink:#e4e9ec; --muted:#93a3ae; --rule:#2b3741;
  --gold:#e0b351; --gold-soft:#3a3020; --wolf:#c3a3e6; --wolf-soft:#2f2540; --use:#5cc2b6; --use-soft:#183a37; --bg2:#1f2a33; --hl:#4a4020; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:28px 64px}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* masthead */
.mast{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:22px}
.mast h1{font-size:clamp(40px,7vw,76px);font-weight:900;line-height:1;letter-spacing:.02em}
.mast h1 small{display:block;font-family:var(--f-mono);font-weight:400;font-size:14px;letter-spacing:.12em;color:var(--muted);margin-top:10px;text-transform:uppercase}
.thesis{font-size:17px;max-width:34em;margin:14px 0 0}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px}
.stat b{display:block;font-family:var(--f-mono);font-size:30px;font-weight:500;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.stat:last-child{grid-column:1/-1}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lang{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.lang button{white-space:nowrap;border:0;background:var(--sheet);padding:4px 10px;cursor:pointer;font-size:12.5px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.search{margin-top:18px;display:flex;gap:8px;position:relative}
.search input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:4px}
.sugg{position:absolute;top:100%;left:0;right:0;background:var(--sheet);border:1px solid var(--rule);z-index:5;max-height:320px;overflow:auto;border-radius:0 0 4px 4px}
.sugg button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:none;padding:8px 12px;cursor:pointer;gap:10px}
.sugg button:hover,.sugg button:focus{background:var(--bg2)}

section{margin-top:44px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.sechead h2{font-size:26px}
.sechead p{margin:0;color:var(--muted);font-size:14px;max-width:40em}

/* featured ledger */
.feat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;min-width:0}
.card:hover{border-color:var(--ink)}
.card .who{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card h3{font-size:21px;line-height:1.15}
.badges{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.medal.wolf{background:var(--wolf-soft);color:var(--wolf);border-color:var(--wolf)}
.ctag.ml{color:var(--use);border-color:var(--use)}
.metsw .metmore{color:var(--muted);font-size:12.5px}
.board li.wf .bar i{background:var(--wolf)}
.medal.abel{background:var(--use-soft);color:var(--use);border-color:var(--use)}
.card .en{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);margin-top:2px}
.medal{font-family:var(--f-mono);font-size:11.5px;white-space:nowrap;background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold);padding:2px 7px;border-radius:999px}
.medal.new{background:var(--gold);color:var(--sheet)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--rule);padding-top:10px}
.trio b{font-family:var(--f-mono);font-size:22px;font-weight:500;display:block}
.trio span{font-size:12px;color:var(--muted)}
.mix{display:flex;height:8px;border-radius:2px;overflow:hidden;background:var(--bg2)}
.mix i{display:block}
.mixkey{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.k2{background:var(--use)}.k1{background:var(--gold)}.k0{background:var(--muted);opacity:.45}
.quote{font-size:13.5px;color:var(--ink);border-left:2px solid var(--use);padding-left:10px;margin:0}
.quote em{font-style:normal;color:var(--muted);display:block;font-size:12px;margin-top:4px}
.fields26{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:12px}
.mini{flex-direction:column;align-items:flex-start}
.mini{background:transparent;border:1px dashed var(--gold);border-radius:6px;padding:12px 14px;cursor:pointer;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center;min-width:0}
.mini:hover{background:var(--sheet)}
.mini b{font-family:var(--f-display);font-size:18px}
.mini span{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}

/* field rail */
.rail{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--rule);background:var(--sheet);padding:6px 11px;border-radius:999px;cursor:pointer;font-size:13.5px;display:inline-flex;gap:7px;align-items:center}
.chip .num{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="true"] .num{color:var(--paper);opacity:.75}
.chip.star{border-color:var(--gold);border-width:2px;font-weight:600}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;margin-top:20px}
.panel{min-width:0}
.panel h3{font-size:18px;margin-bottom:10px}
.board{list-style:none;margin:0;padding:0}
#board{max-height:640px;overflow-y:auto;padding-right:6px;border-top:1px solid var(--rule)}
.board li{display:grid;grid-template-columns:28px minmax(0,1fr) 120px 40px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.board li:hover{background:var(--bg2)}
.board .rk{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
.board .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .nm small{color:var(--muted);margin-left:6px}
.bar{height:6px;background:var(--bg2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.board li.fm .bar i{background:var(--gold)}
.board li.ab .bar i{background:var(--use)}
.board .ct{font-family:var(--f-mono);font-size:13px;text-align:right}
.matrixwrap{overflow-x:auto;border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:10px}
.matrix{border-collapse:separate;border-spacing:2px;font-size:12px}
.matrix th.rowh{text-align:right;font-weight:500;white-space:nowrap;padding-right:6px;cursor:pointer}
.matrix td{width:13px;height:13px;border-radius:2px;background:var(--bg2);padding:0}
.matrix td.on{background:var(--ink)}
.matrix td.on.fmc{background:var(--gold)}
.matrix th.colh{height:10px}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}

/* papers */
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.tools input,.tools select{font:inherit;padding:8px 10px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:4px;min-width:0}
.tools input{flex:1 1 260px}
.tablewrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:6px}
table.pl{width:100%;border-collapse:collapse;font-size:14px}
.pl th{text-align:left;font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
.pl td{padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
.pl tr{cursor:pointer}
.pl tbody tr:hover{background:var(--bg2)}
.pl .r{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.tag{font-size:11.5px;border:1px solid var(--rule);padding:1px 6px;border-radius:3px;color:var(--muted);white-space:nowrap}
.tag.ha{border-color:var(--gold);color:var(--gold)}
.more{margin-top:10px;border:1px solid var(--rule);background:var(--sheet);padding:8px 14px;border-radius:4px;cursor:pointer}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--sheet);z-index:21;overflow-y:auto;box-shadow:-12px 0 40px rgba(0,0,0,.18);padding:calc(18px + env(safe-area-inset-top,0px)) 22px calc(40px + env(safe-area-inset-bottom,0px))}
.sheet .close{position:sticky;top:0;float:right;border:1px solid var(--rule);background:var(--sheet);border-radius:4px;padding:4px 10px;cursor:pointer}
.sheet h2{font-size:30px;line-height:1.15;margin-top:6px}
.sheet .sub{color:var(--muted);font-family:var(--f-mono);font-size:13px;margin-top:4px}
.sheet .trio{margin-top:16px;border-top:2px solid var(--ink)}
.sheet .mix{margin-top:12px}
.sheet .mixkey{margin:6px 0 4px}
.entry{border-top:1px solid var(--rule);padding:14px 0}
.entry h4{margin:0 0 4px;font-size:15.5px;font-weight:600}
.entry h4 a{text-decoration:none}
.entry h4 a:hover{text-decoration:underline}
.meta{font-size:12.5px;color:var(--muted)}
.cw{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.cw li{font-size:13.5px}
.cw li a{color:var(--use)}
.ctx{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.ctx li{font-size:13.5px;background:var(--paper);border-radius:4px;padding:8px 10px}
.ctx .lab{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:3px;margin-right:6px;white-space:nowrap}
.lab.l2{background:var(--use-soft);color:var(--use)}
.lab.l1{background:var(--gold-soft);color:var(--gold)}
.lab.l0{background:var(--bg2);color:var(--muted)}
mark{background:var(--hl);color:inherit;padding:0 1px;border-radius:2px}
.m{font-family:var(--f-mono);font-size:.92em}
.refs{list-style:none;margin:10px 0 0;padding:0;counter-reset:r}
.refs li{padding:7px 0;border-bottom:1px solid var(--rule);font-size:13.5px;display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px}
.refs li::before{counter-increment:r;content:"[" counter(r) "]";font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.au{cursor:pointer;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:2px}
.au:hover{text-decoration-color:var(--ink)}
.au.fmn{color:var(--gold)}
.self{color:var(--muted);font-style:italic}

.method{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:20px 22px;font-size:14px}
.method ul{margin:8px 0 0;padding-left:20px}
.method li{margin:4px 0}
footer{margin-top:40px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}

@media (max-width:900px){
  .mast{grid-template-columns:1fr}
  .feat{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fields26{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:520px){
  .feat{grid-template-columns:1fr}
  .board li{grid-template-columns:24px minmax(0,1fr) 60px 34px}
  .pl .hide-s{display:none}
}
@media (prefers-reduced-motion:no-preference){.card,.chip,.mini{transition:border-color .15s,background .15s}}

.atlasbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.atl-tools{display:flex;gap:8px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.legend svg{vertical-align:middle;margin-right:4px}
.mapbox{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
#map{display:block;width:100%;height:auto;aspect-ratio:1200/780;max-width:100%;cursor:grab;touch-action:none}
#map text{font-family:var(--f-body)}
#map .region{font-family:var(--f-display);font-weight:900;fill:var(--muted);opacity:.85;paint-order:stroke;stroke:var(--sheet);stroke-width:4px;text-anchor:middle;pointer-events:none}

#map .lbl{font-size:10.5px;fill:var(--ink);paint-order:stroke;stroke:var(--sheet);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
#map .stone{stroke:var(--ink);stroke-width:1.2;cursor:pointer}
#map .stone.lau{stroke:var(--gold);stroke-width:2}
#map .pp{cursor:pointer}
#map .edge{stroke:var(--muted);stroke-opacity:.07;fill:none}
#map.showedges .edge{stroke-opacity:.16}
#map .edge.on{stroke:var(--gold);stroke-opacity:.75;stroke-width:1.2}
#map .dim{opacity:.12}
.tip{position:absolute;max-width:300px;background:var(--ink);color:var(--paper);font-size:12.5px;line-height:1.4;padding:7px 9px;border-radius:4px;pointer-events:none;z-index:3}
.cty{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 28px}
.crow{display:grid;grid-template-columns:96px minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:13.5px;padding:4px 0;border-bottom:1px solid var(--rule);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.crow:hover{background:var(--bg2)}
.crow .cb{height:8px;background:var(--bg2);border-radius:2px;overflow:hidden}
.crow .cb i{display:block;height:100%;background:var(--use)}
.crow .cn{font-family:var(--f-mono);font-size:12.5px;text-align:right}
.crow small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;grid-column:2/4}
.ctag{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--rule);border-radius:3px;padding:0 5px;margin-left:6px;white-space:nowrap}
@media (max-width:700px){.cty{grid-template-columns:1fr}}
.upd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:13.5px;border:1px solid var(--rule);border-left:3px solid var(--use);background:var(--sheet);border-radius:4px;padding:8px 12px;margin-bottom:22px}
.upd .ut{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper);background:var(--use);padding:1px 7px;border-radius:3px}
.upd .ud{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.upd .ux{flex:1 1 300px;min-width:0}
.upd details{width:100%;font-size:13px}
.upd summary{cursor:pointer;color:var(--muted);font-size:12.5px}
.upd ol{margin:6px 0 0;padding-left:18px}
.upd li{margin:3px 0}
.upd .auto{color:var(--muted);font-size:12.5px}
.metbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.metsw{display:inline-flex;align-items:center;gap:0;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--sheet)}
.metsw .eyebrow{padding:0 10px}
.metsw button{border:0;border-left:1px solid var(--rule);background:transparent;padding:5px 10px;cursor:pointer;font-size:13px}
.metsw button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.metbar .note{margin:0}
.trio .on b{color:var(--use)}
.trio .on span{color:var(--ink);font-weight:500}
.aff{font-size:12.5px;color:var(--muted)}
.affs{color:var(--muted);margin-left:6px;font-size:11.5px}
.board .nm .affs{display:inline}
</style>

<div class="wrap">
  <div class="upd" id="upd"></div>
  <header class="mast">
    <div>
      <div class="topline"><div class="eyebrow" data-i="eyebrow"></div><div class="lang" role="group" aria-label="Language"><button type="button" data-lang="zh">中文</button><button type="button" data-lang="en">EN</button></div></div>
      <h1 data-i="h1"></h1>
      <p class="thesis" data-i="thesis"></p>
      <div class="search">
        <label for="q" class="eyebrow" style="position:absolute;left:-9999px" data-i="searchLabel"></label>
        <input id="q" type="search" data-ph="searchPh" autocomplete="off">
        <div class="sugg" id="sugg" hidden></div>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <section id="atlas">
    <div class="sechead">
      <h2 data-i="atlasH"></h2>
      <p data-i="atlasP"></p>
    </div>
    <div class="atlasbar">
      <div class="atl-tools">
        <button type="button" class="chip" id="tgEdges" aria-pressed="false" data-i="tgEdges"></button>
        <button type="button" class="chip" id="tgReset" data-i="tgReset"></button>
      </div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="mapbox" id="mapbox"><svg id="map" role="img" aria-label="Foundations map"></svg><div class="tip" id="tip" hidden></div></div>
    <p class="note" data-i="atlasNote"></p>
  </section>

  <section id="countries">
    <div class="sechead">
      <h2 data-i="ctyH"></h2>
      <p data-i="ctyP"></p>
    </div>
    <div class="metbar"><div class="metsw" role="group"></div><span class="metnote note"></span></div>
    <div class="cty" id="cty"></div>
  </section>

  <section id="featured">
    <div class="sechead">
      <h2 data-i="featH"></h2>
      <p data-i="featP"></p>
    </div>
    <div class="metbar"><div class="metsw" role="group"></div><span class="metnote note"></span></div>
    <div class="feat" id="feat"></div>
    <div class="eyebrow" style="margin-top:22px" data-i="y26"></div>
    <div class="fields26" id="f26"></div>
  </section>

  <section id="fields">
    <div class="sechead">
      <h2 data-i="fieldsH"></h2>
      <p data-i="fieldsP"></p>
    </div>
    <div class="rail" id="rail"></div>
    <div class="metbar" style="margin-top:12px"><div class="metsw" role="group"></div><span class="metnote note"></span></div>
    <div class="grid2">
      <div class="panel">
        <h3 id="boardTitle"></h3>
        <ol class="board" id="board"></ol>
        <p class="note" data-i="boardNote"></p>
      </div>
      <div class="panel">
        <h3 id="matTitle"></h3>
        <div class="matrixwrap"><table class="matrix" id="matrix"></table></div>
        <p class="note" data-i="matNote"></p>
      </div>
    </div>
  </section>

  <section id="papers">
    <div class="sechead">
      <h2 data-i="papersH"></h2>
      <p data-i="papersP"></p>
    </div>
    <div class="tools">
      <label for="pq" style="position:absolute;left:-9999px" data-i="pqLabel"></label>
      <input id="pq" type="search" data-ph="pqPh">
      <label for="pf" style="position:absolute;left:-9999px" data-i="pfLabel"></label>
