name: Rebuild Shoulders
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch openai/math sources (no PDFs)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/openai/math openai-math
          cd openai-math
          git sparse-checkout set --no-cone '/*' '!*.pdf'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild
        env:
          OPENAI_MATH: ${{ github.workspace }}/openai-math
          OUT_DIR: ${{ github.workspace }}/Shoulders/math
        run: |
          cd Shoulders/math/scripts
          old=$(cat data.sha)
          for s in fields extract build_data contexts cites pack assemble; do python -I $s.py; done
          python -I ../../hub.py
          if [ "$old" = "$(cat data.sha)" ]; then echo "CHANGED=0" >> $GITHUB_ENV; else echo "CHANGED=1" >> $GITHUB_ENV; fi
      - name: Commit if data changed
        if: env.CHANGED == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A Shoulders/math Shoulders/index.html Shoulders/en/index.html
          git commit -m "Shoulders math: rebuild from openai/math"
          git push
